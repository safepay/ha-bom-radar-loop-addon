name: Release

# Manually triggered from the Actions tab. Pick a bump type and this will:
#   1. work out the next version from config.json
#   2. bump config.json (and the Python VERSION constant) and commit it
#   3. tag that commit as vX.Y.Z
#   4. create a GitHub release with notes generated from the merged PRs and
#      commits since the previous release
#
# Several PRs are merged to the default branch first (none of them touching the
# version); then this is run once to bump and release them all together. The
# Home Assistant add-on store reads the version from config.json on the default
# branch, so the bump commit is what actually offers the update to users.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      title:
        description: "Release title (leave blank to use the version number)"
        type: string
      draft:
        description: "Create as a draft so the notes can be edited before publishing"
        type: boolean
        default: false

# The repository default for GITHUB_TOKEN is read-only, so the write access
# needed to push the bump commit, the tag and the release is requested here.
permissions:
  contents: write

concurrency:
  group: release

env:
  CONFIG: bom-radar-loop/config.json
  PYFILE: bom-radar-loop/bom_radar_downloader.py
  CHANGELOG: bom-radar-loop/CHANGELOG.md

jobs:
  release:
    name: Bump, tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed so the existing tags are available to check against.
          fetch-depth: 0

      - name: Guard against releasing from a side branch
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Releases must be cut from ${{ github.event.repository.default_branch }}, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(jq -r '.version' "$CONFIG")"
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::Tag v${next} already exists. Bump a different part of the version."
            exit 1
          fi

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing **${current} -> ${next}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump the version in config.json and the Python constant
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          # Edit the single line in each file rather than rewriting via jq, so
          # the files' existing formatting is preserved and the diff stays small.
          sed -i -E "s/(\"version\": \")[^\"]+(\")/\1${NEXT}\2/" "$CONFIG"
          sed -i -E "s/(^VERSION = ')[^']+(')/\1${NEXT}\2/" "$PYFILE"

          # Confirm config.json is still valid JSON and both bumps actually landed.
          jq -e --arg v "$NEXT" '.version == $v' "$CONFIG" > /dev/null
          grep -q "^VERSION = '${NEXT}'" "$PYFILE"
          git --no-pager diff -- "$CONFIG" "$PYFILE"

      - name: Stamp the changelog
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          # Home Assistant shows this file in the update dialog, so the top
          # section must name the version, not "[Unreleased]". Rename the
          # current [Unreleased] heading to the new version + date and open a
          # fresh empty [Unreleased] above it. No-op if there is no [Unreleased].
          if [ -f "$CHANGELOG" ] && grep -q '^## \[Unreleased\]' "$CHANGELOG"; then
            DATE="$(date +%Y-%m-%d)"
            sed -i -E "0,/^## \[Unreleased\]\$/s//## [Unreleased]\n\n## [${NEXT}] - ${DATE}/" "$CHANGELOG"
            git --no-pager diff -- "$CHANGELOG" | head -40
          else
            echo "No [Unreleased] section to stamp."
          fi

      - name: Commit and tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${NEXT}"
          git tag -a "v${NEXT}" -m "v${NEXT}"
          # --atomic: the branch and the tag land together, or neither does.
          git push --atomic origin \
            "HEAD:refs/heads/${GITHUB_REF_NAME}" \
            "refs/tags/v${NEXT}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=(--verify-tag --generate-notes --title "${TITLE:-v${NEXT}}")

          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          else
            args+=(--latest)
          fi

          gh release create "v${NEXT}" "${args[@]}"
          echo "Release v${NEXT} created." >> "$GITHUB_STEP_SUMMARY"
