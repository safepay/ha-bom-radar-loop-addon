name: Release

# Manually triggered from the Actions tab. Pick a bump type and this will:
#   1. work out the next version from config.json
#   2. bump config.json (and the Python VERSION constant) and commit it
#   3. tag that commit as vX.Y.Z
#   4. create a GitHub release with notes generated from the merged PRs and
#      commits since the previous release
#
# Several PRs are merged to the default branch first (none of them touching the
# version); then this is run once to bump and release them all together. The
# Home Assistant add-on store reads the version from config.json on the default
# branch, so the bump commit is what actually offers the update to users.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      title:
        description: "Release title (leave blank to use the version number)"
        type: string
      draft:
        description: "Create as a draft so the notes can be edited before publishing"
        type: boolean
        default: false

# The repository default for GITHUB_TOKEN is read-only, so the write access
# needed to push the bump commit, the tag and the release is requested here.
permissions:
  contents: write

concurrency:
  group: release

env:
  CONFIG: bom-radar-loop/config.json
  PYFILE: bom-radar-loop/bom_radar_downloader.py
  CHANGELOG: bom-radar-loop/CHANGELOG.md
  ARCHIVE: bom-radar-loop/CHANGELOG-ARCHIVE.md
  # How many recent releases the user-facing CHANGELOG.md keeps; older ones are
  # moved to ARCHIVE so Home Assistant's update dialog stays short.
  KEEP_RELEASES: "3"

jobs:
  release:
    name: Bump, tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed so the existing tags are available to check against.
          fetch-depth: 0

      - name: Guard against releasing from a side branch
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Releases must be cut from ${{ github.event.repository.default_branch }}, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(jq -r '.version' "$CONFIG")"
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::Tag v${next} already exists. Bump a different part of the version."
            exit 1
          fi

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing **${current} -> ${next}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump the version in config.json and the Python constant
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          # Edit the single line in each file rather than rewriting via jq, so
          # the files' existing formatting is preserved and the diff stays small.
          sed -i -E "s/(\"version\": \")[^\"]+(\")/\1${NEXT}\2/" "$CONFIG"
          sed -i -E "s/(^VERSION = ')[^']+(')/\1${NEXT}\2/" "$PYFILE"

          # Confirm config.json is still valid JSON and both bumps actually landed.
          jq -e --arg v "$NEXT" '.version == $v' "$CONFIG" > /dev/null
          grep -q "^VERSION = '${NEXT}'" "$PYFILE"
          git --no-pager diff -- "$CONFIG" "$PYFILE"

      - name: Stamp the changelog
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          # Home Assistant shows this file in the update dialog, so the top
          # section must name the version, not "[Unreleased]" (an empty
          # "Unreleased" heading leading a shipped release reads as broken).
          # Rename the current [Unreleased] heading to the new version + date,
          # and do NOT leave a fresh [Unreleased] behind -- the next contributor
          # adds that heading back when they write the first entry after release.
          # No-op if there is no [Unreleased].
          if [ -f "$CHANGELOG" ] && grep -q '^## \[Unreleased\]' "$CHANGELOG"; then
            DATE="$(date +%Y-%m-%d)"
            sed -i -E "0,/^## \[Unreleased\]\$/s//## [${NEXT}] - ${DATE}/" "$CHANGELOG"
            git --no-pager diff -- "$CHANGELOG" | head -40
          else
            echo "No [Unreleased] section to stamp."
          fi

      - name: Trim the changelog and archive older releases
        run: |
          # Keep only the newest $KEEP_RELEASES releases in the user-facing
          # CHANGELOG.md (Home Assistant renders the whole file in the update
          # dialog, so a long history buries what actually changed). Anything
          # older is moved, newest-first, into ARCHIVE. Full history is retained,
          # just not in the file HA shows.
          [ -f "$CHANGELOG" ] || exit 0
          TMP="$(mktemp -d)"

          # Split CHANGELOG.md into: the header (before the first release
          # heading), the newest KEEP_RELEASES sections, and the rest to demote.
          # Only "## [X.Y.Z]" counts as a release; a stray "## [Unreleased]"
          # (n stays 0) is always kept.
          awk -v keep="$KEEP_RELEASES" \
              -v hdr="$TMP/head.md" -v kept="$TMP/kept.md" -v demote="$TMP/demote.md" '
            /^## \[[0-9]/ { n++ }
            n==0    { print > hdr;    next }
            n<=keep { print > kept;   next }
                    { print > demote }
          ' "$CHANGELOG"

          if [ ! -s "$TMP/demote.md" ]; then
            echo "Changelog within the ${KEEP_RELEASES}-release window; nothing to archive."
            exit 0
          fi

          # Rebuild CHANGELOG.md = header + newest sections.
          cat "$TMP/head.md" "$TMP/kept.md" > "$CHANGELOG"

          # Ensure the demoted block ends with a blank line so the first
          # existing archived heading stays separated when prepended.
          printf '\n' >> "$TMP/demote.md"

          # Create the archive with a header on first use.
          if [ ! -f "$ARCHIVE" ]; then
            printf '# Changelog archive\n\nOlder releases, moved out of [CHANGELOG.md](CHANGELOG.md) so Home Assistant'\''s add-on update dialog stays short. Newest first.\n\n' > "$ARCHIVE"
          fi

          # Prepend the demoted sections after the archive's own header
          # (everything before its first release heading).
          awk -v ahdr="$TMP/ahead.md" -v abody="$TMP/abody.md" '
            /^## \[[0-9]/ { seen=1 }
            seen==0 { print > ahdr; next }
                    { print > abody }
          ' "$ARCHIVE"
          touch "$TMP/abody.md"
          cat "$TMP/ahead.md" "$TMP/demote.md" "$TMP/abody.md" > "$ARCHIVE"

          # The archive is a new file on first run, so stage it explicitly
          # (the commit step's "git commit -am" only picks up tracked files).
          git add -- "$CHANGELOG" "$ARCHIVE"
          echo "Archived $(grep -c '^## \[' "$TMP/demote.md") release section(s)."
          git --no-pager diff --cached -- "$CHANGELOG" "$ARCHIVE" | head -60

      - name: Commit and tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${NEXT}"
          git tag -a "v${NEXT}" -m "v${NEXT}"
          # --atomic: the branch and the tag land together, or neither does.
          git push --atomic origin \
            "HEAD:refs/heads/${GITHUB_REF_NAME}" \
            "refs/tags/v${NEXT}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=(--verify-tag --generate-notes --title "${TITLE:-v${NEXT}}")

          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          else
            args+=(--latest)
          fi

          gh release create "v${NEXT}" "${args[@]}"
          echo "Release v${NEXT} created." >> "$GITHUB_STEP_SUMMARY"
